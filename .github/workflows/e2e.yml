name: E2E

# Vor Release: manuell oder bei Versions-Tags, nicht bei jedem Commit.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_EMAIL: e2e@example.ch
      E2E_PASSWORD: e2e-passwort-nur-fuer-ci
      COMPOSE_FILE: docker-compose.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # Nur der Test-Client, Versionen fest und ohne Build-Skripte (Wheels).
      - run: pip install --only-binary :all: httpx==0.28.1 pymupdf==1.28.2 pytest==9.1.1
      - name: Stack hochfahren (Fake-LLM)
        run: |
          docker compose up -d --build
          docker compose up -d --wait --wait-timeout 300 proxy web db redis s3
      - name: Testbenutzer anlegen
        run: |
          docker compose exec -T -e SEED_PASSWORD="$E2E_PASSWORD" web \
            python -m app.auth.seed "E2E" "$E2E_EMAIL"
      - name: Dossier durch die Pipeline schicken
        env:
          E2E_BASE_URL: http://localhost:8000
        run: pytest tests/e2e -q
      - name: Container-Logs bei Fehler
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Stack abbauen
        if: always()
        run: docker compose down -v
