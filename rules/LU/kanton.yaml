# Bestehend schwarz oder grau, neu rot, abzubrechend gelb.
- id: LU-PBV55-4-farbkennzeichnung
  titel: Bestehende, neue und abzubrechende Bauteile in den Bauplänen farblich gekennzeichnet
  scope: { kanton: LU }
  when: { "==": [{ var: vorhabenstyp }, "umbau_anbau"] }
  requires:
    typ: merkmal
    merkmal: farbkennzeichnung_bestand_neu_abbruch
  check: manuell
  schwere: hinweis
  quelle: { erlass: "PBV LU (SRL Nr. 736)", paragraph: "§ 55 Abs. 4", url: "https://srl.lu.ch/app/de/texts_of_law/736/versions/3092" }
  stand: 2026-10-03

