name: Regelquellen prüfen

# Einziger Workflow mit Netzwerkzugriff auf die Regelquellen; ci.yml ruft sie nie ab.
on:
  schedule:
    - cron: "0 5 1 1,7 *" # halbjährlich: 1. Januar und 1. Juli
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyyaml
      - id: check
        name: Quellen abrufen und Hashes vergleichen
        env:
          PYTHONPATH: .
        run: |
          rc=0
          python -m app.rules.source_check --report "$RUNNER_TEMP/report.md" || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -le 1 ]
      - name: Issue für Menschen anlegen
        if: steps.check.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Regelquellen: Änderungen oder Abruffehler ($(date +%F))" \
            --label needs-human \
            --body-file "$RUNNER_TEMP/report.md"
