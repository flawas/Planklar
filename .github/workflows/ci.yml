name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  detect:
    # hashFiles() ist auf Job-Ebene nicht erlaubt, daher Dateiprüfung per Shell.
    runs-on: ubuntu-24.04
    outputs:
      python: ${{ steps.f.outputs.python }}
      rules: ${{ steps.f.outputs.rules }}
      docker: ${{ steps.f.outputs.docker }}
      compose: ${{ steps.f.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - id: f
        run: |
          echo "python=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "rules=$([ -f rules/schema.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "docker=$([ -f Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "compose=$([ -f Dockerfile ] && { [ -f docker-compose.yml ] || [ -f compose.yaml ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: System-Pakete (Tesseract, WeasyPrint)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  rules:
    needs: detect
    if: needs.detect.outputs.rules == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Regelkatalog validieren
        run: python -m app.rules.validate

  docker:
    needs: detect
    if: needs.detect.outputs.docker == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - if: needs.detect.outputs.compose == 'true'
        run: docker compose config -q
      - run: docker build -t liquet:ci .

  smoke:
    needs: detect
    if: needs.detect.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: .env aus Vorlage (nur Platzhalter)
        run: '[ -f .env ] || cp .env.example .env'
      - name: Stack hochfahren
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health prüfen
        run: |
          port="$(docker compose port web 8000 2>/dev/null | cut -d: -f2 || true)"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 --retry-connrefused "http://localhost:${port:-8000}/health"
      - name: Container-Logs bei Fehler
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=200
      - name: Stack abbauen
        if: always()
        run: docker compose down -v
