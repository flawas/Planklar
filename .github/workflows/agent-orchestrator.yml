name: Agent – Abhängigkeiten auflösen

# Wenn ein PR gemergt wird (Issue schliesst), werden blockierte Issues freigegeben,
# deren "Depends on: #N" alle erledigt sind. Das startet agent-dev.yml.
on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: agent-orchestrator
  cancel-in-progress: false

jobs:
  unblock:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Freigeben
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: bash .github/scripts/unblock.sh
