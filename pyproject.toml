[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "planklar"
version = "0.1.0"
description = "Vorprüfung für Baugesuche (formale Vollständigkeit)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic-settings>=2.2",
    "litellm>=1.40",
    "boto3>=1.34",
    "pyyaml>=6",
    "jsonschema>=4.20",
    "pymupdf>=1.24",
    "celery[redis]>=5.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi-users>=15",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "moto[s3]>=5",
    "types-pyyaml>=6",
    "types-jsonschema>=4.20",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.web" = ["templates/*.html", "static/*"]
"app.pipeline" = ["field_maps/*.json", "prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
files = ["app/rules", "app/pipeline"]
strict = true

[[tool.mypy.overrides]]
module = "app.pipeline.preprocess"
disallow_untyped_calls = false
