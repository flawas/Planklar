name: Agent – Abhängigkeiten auflösen

# Wenn ein PR gemergt wird (Issue schliesst), werden blockierte Issues freigegeben,
# deren "Depends on: #N" alle erledigt sind. Das startet agent-dev.yml.
on:
  pull_request:
    types: [closed]
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: agent-orchestrator
  cancel-in-progress: false

jobs:
  unblock:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    steps:
      - name: Secrets aus 1Password laden
        uses: 1password/load-secrets-action@v5
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          AGENT_PAT: op://Github Actions/GitHub Agent PAT/Anmeldedaten
          CLAUDE_CODE_OAUTH_TOKEN: op://Github Actions/Claude OAUTH Token/Anmeldedaten
      - uses: actions/checkout@v7
      - name: Freigeben
        env:
          GH_TOKEN: ${{ env.AGENT_PAT }}
        run: bash .github/scripts/unblock.sh
