name: Agent – Backlog planen

# Manuell starten: der product-owner-Agent zerlegt den Implementationsplan in Issues.
on:
  workflow_dispatch:
    inputs:
      focus:
        description: "Optional: nur diese Phase/Thema planen (z.B. 'Phase 0 und 1')"
        required: false
        default: ""

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Labels anlegen
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
        run: bash .github/scripts/setup-labels.sh
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.AGENT_PAT }}
          prompt: |
            Du arbeitest als Rolle "product-owner". Lies CLAUDE.md und .claude/agents/product-owner.md und folge der Rolle.
            Fokus: ${{ inputs.focus || 'gesamter MVP, Phase 0 bis 5' }}.
            Wichtig: Issues, die `status:ready` bekommen, starten sofort einen Entwickler-Agent. Vergib `status:ready`
            deshalb zuletzt und nur für Issues ohne Abhängigkeit.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Bash(gh issue:*),Bash(gh label:*)"
