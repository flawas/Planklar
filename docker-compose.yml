# Lokale Entwicklung: docker compose up -d --build
# Proxy: http://localhost:8080 (GET /health), Web direkt: http://localhost:8000, S3-API: http://localhost:8333
# Konfiguration: .env.example nach .env kopieren (optional, alle Werte haben Entwicklungs-Defaults).

x-app: &app
  build:
    context: .
    args:
      GIT_COMMIT: ${GIT_COMMIT:-unbekannt}
  image: liquet:dev
  environment:
    # App: Rolle `liquet_app` (ohne BYPASSRLS, ADR 0005); Migrationen: Besitzerrolle `liquet`.
    DATABASE_URL: postgresql+psycopg://liquet_app:${DB_APP_PASSWORD:-liquet_app}@db:5432/liquet
    MIGRATION_DATABASE_URL: postgresql+psycopg://liquet:liquet@db:5432/liquet
    DB_APP_PASSWORD: ${DB_APP_PASSWORD:-liquet_app}
    REQUIRE_RLS_ROLE: "true"
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://s3:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-liquet}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-liquet}
    LLM_MODEL: ${LLM_MODEL:-}
    LLM_API_KEY: ${LLM_API_KEY:-}
    RETENTION_DAYS: ${RETENTION_DAYS:-30}
    AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me}
    AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  proxy:
    image: caddy:2.11.6-alpine
    ports:
      - "${PROXY_HTTP_PORT:-8080}:80"
      - "${PROXY_HTTPS_PORT:-8443}:443"
    environment:
      # Lokal :80 (ohne TLS); in Produktion der Hostname, dann holt Caddy das Zertifikat automatisch.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    <<: *app
    # Migrationen vor dem Start (das Lifespan schreibt den Regelkatalog in die DB);
    # schlägt `alembic upgrade head` fehl, startet uvicorn nicht.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head && python -m app.db.app_role && exec uvicorn app.main:app --host
        0.0.0.0 --port 8000
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["celery", "-A", "app.worker", "worker", "--concurrency=2"]
    # Der Healthcheck des Images prüft HTTP und passt nicht zum Worker.
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker inspect ping -d celery@$$HOSTNAME -t 5"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5

  # Genau eine Instanz: mehrere Beat-Dienste würden den Retention-Job parallel auslösen.
  beat:
    <<: *app
    command:
      - celery
      - -A
      - app.worker
      - beat
      - --pidfile=/tmp/celerybeat.pid
      - --schedule=/tmp/celerybeat-schedule
    # Beat hat keinen inspect-Kanal; geprüft wird, ob der Prozess aus der PID-Datei lebt.
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liquet
      POSTGRES_PASSWORD: liquet
      POSTGRES_DB: liquet
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liquet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.20
    command: ["server", "-dir=/data", "-s3"]
    environment:
      # Legt die Admin-Identität des S3-Zugangs an; ohne sie lehnt SeaweedFS signierte Anfragen ab.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-liquet}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-liquet}
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    restart: unless-stopped

  # Nur für Backup/Restore (scripts/backup.sh, scripts/restore.sh): `docker compose --profile backup run --rm backup ...`
  backup:
    image: amazon/aws-cli:2.17.40
    profiles: ["backup"]
    entrypoint: ["aws", "--endpoint-url", "http://s3:8333"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-liquet}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-liquet}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ${BACKUP_DIR:-./backups}:/backup
    depends_on:
      - s3

volumes:
  caddy-data:
  db-data:
  s3-data:
