  requires:
    typ: dokument
    dokument: Querprofil Gewässer
  check: manuell
  schwere: fehlt_blockierend
  quelle: { erlass: "rawi-Wegleitung Baugesuch und Beilagen (Stand Juli 2026)", paragraph: "Ziff. 1.2.2.2", url: "https://rawi.lu.ch/-/media/RAWI/Dokumente/Baubewilligungen/dl_wegleitung_baugesuch_und_beilagen.pdf" }
  stand: 2026-10-03

