# Kantonsbasis Luzern. Nur formelle Vollständigkeit der Beilagen, keine materielle Baurechtsprüfung.
# Variablen in `when`: vorhabenstyp, gewaesserbezug, kantonsstrassenbezug, waldbezug, ausserhalb_bauzone.
# Nicht abgedeckte Lücken: siehe PR zu Issue #24.

- id: LU-PBV55-1-baugesuchsformular
  titel: Baugesuchsformular (kantonales eFormular)
  scope: { kanton: LU }
  when: true
  requires:
    typ: dokument
    dokument: Baugesuchsformular
  check: ki_klassifikation
  schwere: fehlt_blockierend
  quelle: { erlass: "PBV LU (SRL Nr. 736)", paragraph: "§ 55 Abs. 1", url: "https://srl.lu.ch/app/de/texts_of_law/736/versions/3092" }
  stand: 2026-10-03

