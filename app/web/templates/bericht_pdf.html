<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <title>Prüfbericht Dossier {{ dossier.gemeinde }}</title>
  <style>
    @page { size: A4; margin: 18mm 16mm 20mm;
      @bottom-left { content: "Das Tool gibt Hinweise und entscheidet nichts."; font-size: 8pt; color: #444; }
      @bottom-right { content: "Seite " counter(page) " von " counter(pages); font-size: 8pt; color: #444; } }
    body { font: 10pt/1.4 "DejaVu Sans", sans-serif; color: #111; }
    h1 { font-size: 16pt; } h3 { font-size: 11pt; margin: 0 0 .2em; }
    .befund { break-inside: avoid; border: 1px solid #888; border-left-width: 5px; padding: 6pt 8pt; margin: 0 0 8pt; }
    .ampel-erfuellt { border-left-color: #1b6e2e; } .ampel-fehlt { border-left-color: #9b1c1c; }
    .ampel-unsicher { border-left-color: #8a6100; } .ampel-manuell { border-left-color: #0b5394; }
    .ampel { font-weight: 700; } .zaehler { list-style: none; padding: 0; display: flex; gap: 10pt; }
    .meta dt { float: left; clear: left; width: 25mm; font-weight: 700; } .meta dd { margin: 0 0 2pt 27mm; }
    .quelle, .override, .belege { font-size: 9pt; margin: 2pt 0; }
    .hinweis { border: 1px solid #888; padding: 6pt; }
    .aktionen, progress { display: none; }
  </style>
</head>
<body>
  {% include "_bericht.html" %}
</body>
</html>
